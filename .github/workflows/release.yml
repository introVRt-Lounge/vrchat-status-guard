name: Release

# Tag-gated: push v1.2.3 (or workflow_dispatch with version input).
# Single installer path: Velopack Setup.exe + update packages only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.2.0). Creates tag v{version} assets."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

env:
  VELOPACK_VERSION: "1.2.161"
  PACK_ID: "VRChatStatusGuard"

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must look like 0.2.0 (got '$v')"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version $v"

      - name: Install vpk
        shell: pwsh
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download previous Velopack release (delta baseline)
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack

      - name: Publish + Velopack pack
        shell: pwsh
        run: |
          .\scripts\build-velopack.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -PackId "${{ env.PACK_ID }}" `
            -VpkVersion "${{ env.VELOPACK_VERSION }}" `
            -SkipToolInstall

      - name: Upload Velopack artifact
        uses: actions/upload-artifact@v4
        with:
          name: VrchatStatusGuard-Setup
          path: artifacts/velopack/*
          if-no-files-found: error

      - name: Publish GitHub Release (Velopack)
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack `
            --tag ${{ steps.ver.outputs.tag }} `
            --releaseName "VRChat Status Guard ${{ steps.ver.outputs.tag }}" `
            --publish
