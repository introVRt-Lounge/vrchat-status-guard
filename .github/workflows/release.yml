name: Release

# Tag-gated: push v1.2.3 (or workflow_dispatch with version input).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.2.0). Creates tag v{version} assets."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

env:
  VELOPACK_VERSION: "1.2.161"
  PACK_ID: "VRChatStatusGuard"

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must look like 0.2.0 (got '$v')"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version $v"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --silent `
            --accept-package-agreements --accept-source-agreements
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "${env:ProgramFiles}\Inno Setup 7",
            "${env:ProgramFiles(x86)}\Inno Setup 7"
          )
          foreach ($p in $paths) {
            if (Test-Path (Join-Path $p "ISCC.exe")) {
              "$p" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "ISCC path: $p"
              break
            }
          }

      - name: Build Inno Setup.exe
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Install vpk
        shell: pwsh
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download previous Velopack release (delta baseline)
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack

      - name: Velopack pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe VrchatPrivacy.App.exe `
            --packTitle "VRChat Status Guard" `
            --outputDir artifacts/velopack

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VrchatStatusGuard-Setup
          path: |
            artifacts/installer/*.exe
            artifacts/velopack/*
          if-no-files-found: error

      - name: Create / update GitHub Release (Inno)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VRChat Status Guard ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: artifacts/installer/*.exe

      - name: Upload Velopack assets to GitHub Release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack `
            --tag ${{ steps.ver.outputs.tag }} `
            --releaseName "VRChat Status Guard ${{ steps.ver.outputs.tag }}" `
            --merge
