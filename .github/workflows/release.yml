name: Release

# Ship train (#72 / #77):
# - push to main: auto-release only for conventional major/minor (breaking / feat)
# - patch-level merges (fix, docs, chore, ops, …): no auto release
# - workflow_dispatch: on-demand patch (or explicit version); always ships
# - optional v* tags still publish
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver without leading v. Empty = bump patch (on-demand)."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-ship
  cancel-in-progress: false

env:
  VELOPACK_VERSION: "1.2.161"
  PACK_ID: "VRChatStatusGuard"

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"

          $eventName = "${{ github.event_name }}"
          $refType = "${{ github.ref_type }}"

          # Already shipped this exact commit? Skip (re-run / double trigger).
          $tagsHere = @(git tag --points-at "$env:GITHUB_SHA" --list "v*")
          if ($tagsHere.Count -gt 0) {
            Write-Host "Commit already tagged: $($tagsHere -join ', '). Skipping release."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $ErrorActionPreference = $prevEap
            exit 0
          }

          git fetch --tags --force origin 2>&1 | Out-Host
          $latest = git tag -l "v*" --sort=-v:refname | Select-Object -First 1
          if (-not $latest) { $latest = "v0.0.0" }

          function Get-BumpKind {
            param([string]$RangeFrom)
            $raw = git log "$RangeFrom..HEAD" --format="%s%n%b%n---" 2>$null
            if (-not $raw) { return "none" }
            $text = ($raw | Out-String)
            $kind = "none"
            foreach ($block in ($text -split "(?m)^---\s*$")) {
              if ([string]::IsNullOrWhiteSpace($block)) { continue }
              $lines = @($block -split "`n" | ForEach-Object { $_.TrimEnd() })
              $subject = ($lines | Where-Object { $_.Trim() -ne "" } | Select-Object -First 1)
              if (-not $subject) { continue }
              $body = ($lines | Select-Object -Skip 1) -join "`n"
              if ($subject -match '^[a-z]+(\([^)]+\))?!:' -or $body -match '(?m)^BREAKING CHANGE:') {
                return "major"
              }
              if ($subject -match '^feat(\(|:|!)') {
                $kind = "minor"
              }
              elseif ($kind -eq "none" -and $subject -match '^(fix|perf)(\(|:|!)') {
                $kind = "patch"
              }
            }
            return $kind
          }

          function Bump-Semver {
            param([string]$Tag, [ValidateSet("major","minor","patch")][string]$Kind)
            $parts = $Tag.TrimStart('v').Split('.')
            if ($parts.Count -lt 3) { throw "Latest tag '$Tag' is not semver X.Y.Z" }
            $maj = [int]$parts[0]; $min = [int]$parts[1]; $pat = [int]$parts[2]
            switch ($Kind) {
              "major" { $maj++; $min = 0; $pat = 0 }
              "minor" { $min++; $pat = 0 }
              "patch" { $pat++ }
            }
            return "$maj.$min.$pat"
          }

          $v = $null
          $bump = $null

          if ($eventName -eq "workflow_dispatch") {
            $raw = "${{ inputs.version }}".Trim()
            if ($raw) {
              $v = $raw.TrimStart('v')
              $bump = "explicit"
            }
            else {
              $bump = "patch"
              $v = Bump-Semver -Tag $latest -Kind patch
              Write-Host "On-demand patch: $latest -> v$v"
            }
          }
          elseif ($refType -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v')
            $bump = "tag"
          }
          else {
            # push to main: major/minor only; patch-level skips (on-demand).
            if ($latest -eq "v0.0.0") {
              $bumpKind = "minor"
            }
            else {
              $bumpKind = Get-BumpKind -RangeFrom $latest
            }
            Write-Host "Conventional bump since $latest : $bumpKind"
            if ($bumpKind -eq "major" -or $bumpKind -eq "minor") {
              $bump = $bumpKind
              $v = if ($latest -eq "v0.0.0") { "0.1.0" } else { Bump-Semver -Tag $latest -Kind $bumpKind }
              Write-Host "Auto-release $bumpKind : $latest -> v$v"
            }
            else {
              Write-Host "Patch-level or non-releasable commits only. Skipping auto-release (use workflow_dispatch for a patch)."
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              $ErrorActionPreference = $prevEap
              exit 0
            }
          }

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 0.2.0 (got '$v')"
          }

          git rev-parse -q --verify "refs/tags/v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag v$v already exists but does not point at this commit. Abort."
          }

          $ErrorActionPreference = $prevEap
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bump=$bump" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prev_tag=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version $v @ $env:GITHUB_SHA (bump=$bump)"
          exit 0

      - name: Install vpk
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download previous Velopack release (delta baseline)
        if: steps.ver.outputs.skip != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack

      - name: Write release notes
        if: steps.ver.outputs.skip != 'true'
        id: notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ steps.ver.outputs.tag }}"
          $prev = "${{ steps.ver.outputs.prev_tag }}"
          $path = "artifacts/release-notes.md"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## Status Guard $tag")
          $lines.Add("")
          if ($prev -and $prev -ne "v0.0.0") {
            $lines.Add("Changes since ``$prev``:")
            $lines.Add("")
            $subjects = @(git log "$prev..HEAD" --pretty=format:"- %s")
            if ($subjects.Count -eq 0) {
              $lines.Add("- Maintenance release.")
            }
            else {
              foreach ($s in $subjects) { $lines.Add($s) }
            }
          }
          else {
            $lines.Add("- Initial packaged release.")
          }
          $lines.Add("")
          $lines.Add("Install: download **VRChatStatusGuard-win-Setup.exe** from the assets below.")
          ($lines -join "`n") + "`n" | Set-Content -Path $path -Encoding utf8
          Get-Content $path | Write-Host
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish + Velopack pack
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          .\scripts\build-velopack.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -PackId "${{ env.PACK_ID }}" `
            -VpkVersion "${{ env.VELOPACK_VERSION }}" `
            -ReleaseNotesPath "${{ steps.notes.outputs.path }}" `
            -SkipToolInstall

      - name: Upload Velopack artifact
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VrchatStatusGuard-Setup
          path: artifacts/velopack/*
          if-no-files-found: error

      - name: Publish GitHub Release (Velopack)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack `
            --tag ${{ steps.ver.outputs.tag }} `
            --releaseName "VRChat Status Guard ${{ steps.ver.outputs.tag }}" `
            --targetCommitish ${{ github.sha }} `
            --publish

      - name: Set GitHub release body
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # vpk upload leaves body empty; What's New reads GitHub API body (#81).
          gh release edit "${{ steps.ver.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --notes-file "${{ steps.notes.outputs.path }}"
