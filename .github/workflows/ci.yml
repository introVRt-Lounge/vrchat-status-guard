name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Windows tray app - run gates on windows-latest. Do not default to Ubuntu
# just because Core unit tests could run there.

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/VrchatPrivacy.sln
      - name: Build
        run: dotnet build src/VrchatPrivacy.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/VrchatPrivacy.Core.Tests/VrchatPrivacy.Core.Tests.csproj --no-build -c Release --verbosity normal

  secret-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Org repos need a paid GITLEAKS_LICENSE for gitleaks-action; use Docker CLI.
      - name: Gitleaks (Docker)
        shell: bash
        run: |
          docker run --rm -v "/$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --log-opts=HEAD

  owasp-sast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep OWASP + project rules
        shell: bash
        run: |
          docker run --rm -v "/$PWD:/src" -w /src semgrep/semgrep:1.122.0 \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/csharp \
              --config p/secrets \
              --config /src/security/semgrep/vrchat-privacy.yml \
              --error \
              /src/src /src/tests

  security-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/VrchatPrivacy.sln
      - name: Vulnerable package audit
        run: dotnet list src/VrchatPrivacy.sln package --vulnerable --include-transitive

  ci:
    needs: [test, secret-scan, owasp-sast, security-audit]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          echo "test=${{ needs.test.result }}"
          echo "secret-scan=${{ needs.secret-scan.result }}"
          echo "owasp-sast=${{ needs.owasp-sast.result }}"
          echo "security-audit=${{ needs.security-audit.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.secret-scan.result }}" = success
          test "${{ needs.owasp-sast.result }}" = success
          test "${{ needs.security-audit.result }}" = success

  merge-on-green:
    needs: [ci]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      needs.ci.result == 'success' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state -q .state)
          if [ "$STATE" = "OPEN" ]; then
            gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
          else
            echo "PR already $STATE, skipping"
          fi
