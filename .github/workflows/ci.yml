name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# App build/test/installer: windows-latest.
# Gitleaks + Semgrep container images are Linux-only; those two jobs stay on
# ubuntu-latest. That is scanner infrastructure, not the product runtime.

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: >
          dotnet test tests/VrchatPrivacy.Core.Tests/VrchatPrivacy.Core.Tests.csproj
          -c Release --verbosity normal

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --silent `
            --accept-package-agreements --accept-source-agreements
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "${env:ProgramFiles}\Inno Setup 7",
            "${env:ProgramFiles(x86)}\Inno Setup 7"
          )
          foreach ($p in $paths) {
            if (Test-Path (Join-Path $p "ISCC.exe")) {
              "$p" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "ISCC path: $p"
              break
            }
          }
      - name: Build Setup.exe
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "0.1.0"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VrchatPrivacyGuard-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks (Docker)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --log-opts=HEAD

  owasp-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep OWASP + project rules
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.122.0 \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/csharp \
              --config p/secrets \
              --config /src/security/semgrep/vrchat-privacy.yml \
              --error \
              /src/src /src/tests

  security-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/VrchatPrivacy.sln
      - name: Vulnerable package audit
        run: dotnet list src/VrchatPrivacy.sln package --vulnerable --include-transitive

  ci:
    needs: [test, installer, secret-scan, owasp-sast, security-audit]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          echo "test=${{ needs.test.result }}"
          echo "installer=${{ needs.installer.result }}"
          echo "secret-scan=${{ needs.secret-scan.result }}"
          echo "owasp-sast=${{ needs.owasp-sast.result }}"
          echo "security-audit=${{ needs.security-audit.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.installer.result }}" = success
          test "${{ needs.secret-scan.result }}" = success
          test "${{ needs.owasp-sast.result }}" = success
          test "${{ needs.security-audit.result }}" = success

  merge-on-green:
    needs: [ci]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      needs.ci.result == 'success' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state -q .state)
          if [ "$STATE" = "OPEN" ]; then
            gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
          else
            echo "PR already $STATE, skipping"
          fi
